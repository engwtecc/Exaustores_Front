<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morador</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f4ef;
}

.topo{

    width:100%;
    height:80px;

    background:#5f8136;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
    box-sizing:border-box;
}

.topo h1{
    margin:0;
}

.topo button{

    width:140px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;
    cursor:pointer;
}

.container{

    width:100%;
    padding:40px;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    box-sizing:border-box;
}

.card{

    width:100%;
    max-width:420px;

    background:white;

    border-radius:25px;

    padding:30px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);

    text-align:center;
}

.card h2{
    color:#5f8136;
}

.card img{
    width:140px;
    margin:25px 0;
}

.status{

    font-size:24px;
    font-weight:bold;

    margin-bottom:25px;
}

.ligado{
    color:green;
}

.desligado{
    color:red;
}

.card button{

    width:100%;
    height:55px;

    border:none;
    border-radius:12px;

    background:#5f8136;
    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}

.info{

    margin-top:25px;

    background:#f2f4ef;

    padding:15px;

    border-radius:15px;

    text-align:left;
}

</style>

</head>

<body>

<div class="topo">

    <h1>
        Controle de Exaustor
    </h1>

    <button onclick="logout()">
        Sair
    </button>

</div>

<div class="container">

    <div id="conteudo"></div>

</div>

<script>

const API =
"https://exaustores-production.up.railway.app"

const token =
localStorage.getItem("token")

if(!token){

    window.location.href =
    "index.html"
}

// ========================================
// DESCOBRE A PRUMADA DO APARTAMENTO
// ========================================

function pegarLadoApartamento(apto){

    const texto = apto.padStart(4,"0")

    return Number(
        texto.substring(2,4)
    )
}

// ========================================
// DECODIFICA TOKEN
// ========================================

function parseJwt(token){

    try{

        return JSON.parse(
            atob(
                token.split('.')[1]
            )
        )

    }catch(e){

        return null
    }
}

const payload = parseJwt(token)

const apartamento = payload.sub

const ladoApartamento =
pegarLadoApartamento(apartamento)

// ========================================
// CARREGAR
// ========================================

async function carregar(){

    try{

        const res =
            await fetch(`${API}/status`)

        const data =
            await res.json()

        const ligado =
            data.exaustores[ladoApartamento]

        // verifica se ESTE apartamento
        // está solicitando

        const minhaSolicitacao =
            data.ativos.find(
                a =>
                a.apartamento ==
                apartamento
            )

        const solicitando =
            !!minhaSolicitacao

        const imagem = ligado
            ? "img/Exaustor_On.png"
            : "img/Exaustor_Off.png"

        const texto = ligado
            ? "LIGADO"
            : "DESLIGADO"

        const html = `

        <div class="card">

            <h2>
                Exaustor Prumada
                ${ladoApartamento}
            </h2>

            <img src="${imagem}">

            <div class="
                status
                ${ligado ? 'ligado':'desligado'}
            ">
                ${texto}
            </div>

            <button onclick="
                toggle(${solicitando})
            ">

                ${
                    solicitando
                    ? "Cancelar Solicitação"
                    : "Solicitar Ligação"
                }

            </button>

            <div class="info">

                <b>Apartamento:</b>
                ${apartamento}

                <br><br>

                <b>Prumada:</b>
                ${ladoApartamento}

                <br><br>

                <b>Sua solicitação:</b>
                ${
                    solicitando
                    ? "ATIVA"
                    : "INATIVA"
                }

            </div>

        </div>
        `

        document.getElementById(
            "conteudo"
        ).innerHTML = html

    }catch(e){

        console.log(e)

        document.getElementById(
            "conteudo"
        ).innerHTML = `

        <div class="card">

            <h2>
                Erro ao conectar backend
            </h2>

        </div>
        `
    }
}

// ========================================
// LIGAR / DESLIGAR
// ========================================

async function toggle(solicitando){

    try{

        const acao =
            solicitando
            ? "desligar"
            : "ligar"

        await fetch(
            `${API}/acao`,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token
                },

                body:JSON.stringify({
                    acao
                })
            }
        )

        carregar()

    }catch(e){

        console.log(e)
    }
}

// ========================================
// LOGOUT
// ========================================

function logout(){

    localStorage.clear()

    window.location.href =
    "index.html"
}

carregar()

setInterval(carregar,5000)

</script>

</body>
</html>
