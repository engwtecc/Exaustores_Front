<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morador</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f4ef;
}

.topo{
    width:100%;
    height:80px;
    background:#5f8136;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
    box-sizing:border-box;
}

.topo button{
    width:140px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;
    cursor:pointer;
}

.container{
    padding:30px;

    display:flex;
    justify-content:center;
}

.card{

    width:100%;
    max-width:500px;

    background:white;

    border-radius:25px;

    padding:30px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);

    text-align:center;
}

.card h2{
    color:#5f8136;
}

.card img{
    width:140px;
    margin:20px 0;
}

.status{
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.ligado{
    color:green;
}

.desligado{
    color:red;
}

.btn{

    width:100%;
    height:55px;

    border:none;
    border-radius:12px;

    background:#5f8136;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.info{

    margin-top:25px;

    background:#f2f4ef;

    padding:15px;

    border-radius:15px;

    text-align:left;
}

.perfil{

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid #ddd;

    text-align:left;
}

input{

    width:100%;
    height:45px;

    margin-top:8px;
    margin-bottom:15px;

    padding:10px;

    border:1px solid #ccc;
    border-radius:10px;

    box-sizing:border-box;
}
.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    justify-content:center;
    align-items:center;
}

.modal-box{

    background:white;

    padding:30px;

    border-radius:20px;

    width:350px;

    display:flex;
    flex-direction:column;
    gap:15px;
}

.modal-box input{

    height:45px;

    padding:10px;

    border:1px solid #ccc;

    border-radius:10px;
}

.acoes{

    display:flex;

    gap:10px;
}
</style>

</head>

<body>

<div class="topo">

    <h1>Controle de Exaustor</h1>

    <div>
    
        <button onclick="abrirPerfil()">
            Perfil
        </button>
    
        <button onclick="logout()">
            Sair
        </button>
    
    </div>

</div>

<div class="container">

    <div id="conteudo"></div>

</div>

<script>

const API =
"https://exaustores-production.up.railway.app"

const token =
localStorage.getItem("token")

if(!token){

    window.location.href =
    "index.html"
}

function parseJwt(token){

    try{

        return JSON.parse(
            atob(token.split('.')[1])
        )

    }catch(e){

        localStorage.clear()

        window.location.href =
        "index.html"
    }
}

const payload =
parseJwt(token)

const apartamento =
payload.sub
let editando = false
function pegarLadoApartamento(apto){

    const txt =
        apto.padStart(4,"0")

    return Number(
        txt.substring(2,4)
    )
}

const ladoApartamento =
pegarLadoApartamento(apartamento)

async function abrirPerfil(){

    editando = true

    document.getElementById(
        "modalPerfil"
    ).style.display = "flex"

    try{

        const res =
        await fetch(
            `${API}/perfil`,
            {
                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        )

        const dados =
        await res.json()

        document.getElementById(
            "telefone"
        ).value =
        dados.telefone || ""

    }catch(e){

        console.log(e)
    }
}

function fecharPerfil(){

    editando = false

    document.getElementById(
        "modalPerfil"
    ).style.display = "none"
}
async function salvarPerfil(){

    try{

        await fetch(
            `${API}/perfil`,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json",

                    "Authorization":
                    "Bearer " + token
                },

                body:JSON.stringify({

                    senha:
                    document.getElementById(
                        "novaSenha"
                    ).value,

                    telefone:
                    document.getElementById(
                        "telefone"
                    ).value
                })
            }
        )

        alert(
            "Perfil atualizado"
        )

        fecharPerfil()

    }catch(e){

        console.log(e)
    }
}
async function carregar(){

    try{

        const resStatus =
            await fetch(`${API}/status`)

        const status =
            await resStatus.json()

        const resMe =
            await fetch(
                `${API}/me`,
                {
                    headers:{
                        Authorization:
                        "Bearer " + token
                    }
                }
            )

        const me =
            await resMe.json()

        const ligado =
            status.exaustores[
                ladoApartamento
            ]

        const minhaSolicitacao =
            status.ativos.find(
                a =>
                a.apartamento ==
                apartamento
            )

        const solicitando =
            !!minhaSolicitacao

        const html = `

        <div class="card">

            <h2>
                Exaustor Prumada
                ${ladoApartamento}
            </h2>

            <img src="${
                ligado
                ? 'img/Exaustor_On.png'
                : 'img/Exaustor_Off.png'
            }">

            <div class="
                status
                ${
                    ligado
                    ? 'ligado'
                    : 'desligado'
                }
            ">
                ${
                    ligado
                    ? 'LIGADO'
                    : 'DESLIGADO'
                }
            </div>

            <button
                class="btn"
                onclick="
                toggle(${solicitando})
                "
            >
                ${
                    solicitando
                    ? "Cancelar Solicitação"
                    : "Solicitar Ligação"
                }
            </button>

            <div class="info">

                <b>Apartamento:</b>
                ${apartamento}

                <br><br>

                <b>Prumada:</b>
                ${ladoApartamento}

                <br><br>

                <b>Sua Solicitação:</b>

                ${
                    solicitando
                    ? "ATIVA"
                    : "INATIVA"
                }


        </div>
        `

        document.getElementById(
            "conteudo"
        ).innerHTML = html

    }catch(e){

        console.log(e)
    }
}


    const telefone =
        document.getElementById(
            "telefone"
        ).value

    await fetch(
        `${API}/me`,
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json",

                Authorization:
                "Bearer " + token
            },

            body:JSON.stringify({
                senha,
                telefone
            })
        }
    )

    alert(
        "Cadastro atualizado!"
    )
}

async function toggle(
    solicitando
){

    const acao =
        solicitando
        ? "desligar"
        : "ligar"

    await fetch(
        `${API}/acao`,
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json",

                Authorization:
                "Bearer " + token
            },

            body:JSON.stringify({
                acao
            })
        }
    )

    carregar()
}

function logout(){

    localStorage.clear()

    window.location.href =
    "index.html"
}

carregar()

setInterval(()=>{

    if(!editando){

        carregar()
    }

},5000)

</script>
<div id="modalPerfil" class="modal">

    <div class="modal-box">

        <h2>Meu Perfil</h2>

        <input
            type="password"
            id="novaSenha"
            placeholder="Nova senha"
        >

        <input
            type="text"
            id="telefone"
            placeholder="WhatsApp"
        >

        <div class="acoes">

            <button onclick="salvarPerfil()">
                Salvar
            </button>

            <button onclick="fecharPerfil()">
                Cancelar
            </button>

        </div>

    </div>

</div>
</body>
</html>
