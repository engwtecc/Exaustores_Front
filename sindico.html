<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Síndico</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f2f4ef;
}

.topo{
    width:100%;
    height:80px;

    background:#5f8136;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
}

.topo button{

    width:140px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;

    cursor:pointer;
}

.container{
    padding:40px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:30px;
}

.card{
    background:white;

    border-radius:25px;

    padding:30px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.card h2{
    color:#5f8136;
    margin-bottom:20px;
}

input{
    width:100%;
    height:50px;

    border:1px solid #ccc;
    border-radius:10px;

    padding-left:15px;

    margin-bottom:15px;

    font-size:16px;
}

button{
    width:100%;
    height:50px;

    border:none;
    border-radius:10px;

    background:#5f8136;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.status-item{
    margin-bottom:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

</style>

</head>

<body>

<div class="topo">

    <h1>Painel do Síndico</h1>

    <button onclick="logout()">
        Sair
    </button>

</div>

<div class="container">

    <div class="card">

        <h2>Status dos Exaustores</h2>

        <div id="status"></div>

    </div>

    <div class="card">

        <h2>Tempo de Alerta</h2>

        <input type="number" id="alerta">

        <button onclick="salvarAlerta()">
            Salvar
        </button>

    </div>

    <div class="card">

        <h2>Tempo Máximo</h2>

        <input type="number" id="maximo">

        <button onclick="salvarMaximo()">
            Salvar
        </button>

    </div>

</div>

<script>

const API = "https://exaustores-production.up.railway.app"

const token = localStorage.getItem("token")

if(!token){

    window.location.href = "index.html"

}

async function carregar(){

    const res = await fetch(`${API}/status`)

    const data = await res.json()

    const div = document.getElementById("status")

    div.innerHTML = ""

    Object.entries(data.exaustores).forEach(([lado, ligado])=>{

        div.innerHTML += `

        <div class="status-item">

            <span>
                Lado ${lado}
            </span>

            <strong style="
                color:${ligado ? 'green':'red'}
            ">

                ${
                    ligado
                    ? 'LIGADO'
                    : 'DESLIGADO'
                }

            </strong>

        </div>
        `
    })

}

async function salvarAlerta(){

    const horas =
        document.getElementById("alerta").value

    await fetch(`${API}/sindico/config/alerta`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },

        body:JSON.stringify({
            horas:Number(horas)
        })
    })

    alert("Tempo alerta atualizado")

}

async function salvarMaximo(){

    const horas =
        document.getElementById("maximo").value

    await fetch(`${API}/sindico/config/max-horas`,{

        method:"POST",

        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },

        body:JSON.stringify({
            horas:Number(horas)
        })
    })

    alert("Tempo máximo atualizado")

}

function logout(){

    localStorage.clear()

    window.location.href = "index.html"

}

carregar()

setInterval(carregar,5000)

</script>

</body>
</html>
