<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Síndico</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f4ef;
}

.topo{

    width:100%;
    height:80px;

    background:#5f8136;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
    box-sizing:border-box;
}

.topo h1{
    margin:0;
}

.topo button{

    width:140px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;
    cursor:pointer;
}

.container{

    width:100%;
    padding:30px;
    box-sizing:border-box;
}

.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{

    background:white;
    border-radius:25px;

    padding:25px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);

    text-align:center;
}

.card h2{
    color:#5f8136;
}

.card img{
    width:120px;
    margin:20px 0;
}

.status{

    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.ligado{
    color:green;
}

.desligado{
    color:red;
}

.card button{

    width:100%;
    height:50px;

    border:none;
    border-radius:12px;

    background:#5f8136;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.config-box,
.ativos-box,
.usuario-box{

    background:white;
    border-radius:25px;

    padding:25px;

    margin-top:30px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

input,
select{

    width:100%;
    height:45px;

    margin-top:10px;
    margin-bottom:15px;

    padding:10px;

    border:1px solid #ccc;
    border-radius:10px;

    box-sizing:border-box;
}

.salvar{

    width:100%;
    height:50px;

    border:none;
    border-radius:12px;

    background:#5f8136;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

.item-ativo{

    padding:15px;
    border-bottom:1px solid #ddd;
}

.usuario-item{

    padding:10px;
    border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<div class="topo">

    <h1>Painel do Síndico</h1>

    <button onclick="logout()">
        Sair
    </button>

</div>

<div class="container">

    <!-- EXAUSTORES -->
    <div class="grid" id="cards"></div>

    <!-- CONFIG -->
    <div class="config-box">

        <h2>Configurações</h2>

        <div id="configs"></div>

    </div>

    <!-- APARTAMENTOS -->
    <div class="ativos-box">

        <h2>Apartamentos Solicitando</h2>

        <div id="ativos"></div>

    </div>

    <!-- CADASTRO -->
    <div class="usuario-box">

        <h2>Cadastrar Usuário</h2>

        <input
            type="text"
            id="novoUsuario"
            placeholder="Usuário / Apartamento"
        >

        <input
            type="password"
            id="novaSenha"
            placeholder="Senha"
        >

        <select id="tipoUsuario">

            <option value="morador">
                Morador
            </option>

            <option value="sindico">
                Síndico
            </option>

        </select>

        <button
            class="salvar"
            onclick="salvarUsuario()"
        >
            Salvar Usuário
        </button>

        <br><br>

        <h2>Usuários Cadastrados</h2>

        <div id="usuarios"></div>

    </div>

</div>

<script>

const API =
"https://exaustores-production.up.railway.app"

const token = localStorage.getItem("token")

if(!token){

    window.location.href = "index.html"
}

async function carregar(){

    try{

        // STATUS
        const resStatus = await fetch(
            `${API}/status`
        )

        const status = await resStatus.json()

        // CONFIG
        const resConfig = await fetch(
            `${API}/sindico/config`,
            {
                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        )

        const config = await resConfig.json()

        // USUÁRIOS
        const resUsuarios = await fetch(
            `${API}/sindico/usuarios`,
            {
                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        )

        const usuarios =
            await resUsuarios.json()

        // =========================
        // EXAUSTORES
        // =========================

        const cards =
            document.getElementById("cards")

        cards.innerHTML = ""

        Object.entries(status.exaustores)
        .forEach(([lado, ligado])=>{

            const imagem = ligado
                ? "img/Exaustor_On.png"
                : "img/Exaustor_Off.png"

            const texto = ligado
                ? "LIGADO"
                : "DESLIGADO"

            cards.innerHTML += `

            <div class="card">

                <h2>
                    Exaustor Lado ${lado}
                </h2>

                <img src="${imagem}">

                <div class="
                    status
                    ${ligado ? 'ligado':'desligado'}
                ">
                    ${texto}
                </div>

                <button onclick="
                    desligar('${lado}')
                ">
                    Desligar
                </button>

            </div>
            `
        })

        // =========================
        // CONFIGURAÇÕES
        // =========================

        document.getElementById("configs")
        .innerHTML = `

            <p>
                <b>Tempo de alerta:</b>
                ${config.alerta_horas} horas
            </p>

            <p>
                <b>Tempo máximo:</b>
                ${config.max_horas_morador} horas
            </p>
        `

        // =========================
        // APARTAMENTOS
        // =========================

        let htmlAtivos = ""

        status.ativos.forEach(a=>{

            const minutos =
                Math.floor(
                    a.tempo_segundos / 60
                )

            htmlAtivos += `

            <div class="item-ativo">

                <b>Apartamento:</b>
                ${a.apartamento}

                <br>

                <b>Lado:</b>
                ${a.lado}

                <br>

                <b>Tempo:</b>
                ${minutos} min

            </div>
            `
        })

        if(htmlAtivos === ""){

            htmlAtivos = `
                <p>
                    Nenhum apartamento solicitando
                </p>
            `
        }

        document.getElementById("ativos")
        .innerHTML = htmlAtivos

        // =========================
        // USUÁRIOS
        // =========================

        let htmlUsuarios = ""

        usuarios.forEach(u=>{

            htmlUsuarios += `

            <div class="usuario-item">

                <b>${u.usuario}</b>
                - ${u.tipo}

            </div>
            `
        })

        document.getElementById("usuarios")
        .innerHTML = htmlUsuarios

    }catch(e){

        console.log(e)

    }
}

async function desligar(lado){

    try{

        await fetch(
            `${API}/sindico/desligar/${lado}`,
            {
                method:"POST",

                headers:{
                    "Authorization":
                    "Bearer " + token
                }
            }
        )

        carregar()

    }catch(e){

        console.log(e)
    }
}

async function salvarUsuario(){

    const usuario =
        document.getElementById(
            "novoUsuario"
        ).value

    const senha =
        document.getElementById(
            "novaSenha"
        ).value

    const tipo =
        document.getElementById(
            "tipoUsuario"
        ).value

    try{

        await fetch(
            `${API}/sindico/usuario`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":
                    "Bearer " + token
                },

                body:JSON.stringify({
                    usuario,
                    senha,
                    tipo
                })
            }
        )

        alert("Usuário salvo!")

        carregar()

    }catch(e){

        console.log(e)
    }
}

function logout(){

    localStorage.clear()

    window.location.href = "index.html"
}

carregar()

setInterval(carregar,5000)

</script>

</body>
</html>
