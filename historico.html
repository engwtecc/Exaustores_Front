<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Histórico</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f4ef;
}

.topo{

    height:80px;

    background:#5f8136;

    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 30px;

    box-sizing:border-box;
}

.topo h1{
    margin:0;
}

.topo button{

    width:170px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;

    cursor:pointer;
}

.container{

    max-width:1300px;

    margin:auto;

    padding:30px;
}

.card{

    background:white;

    border-radius:20px;

    padding:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{

    width:250px;

    height:45px;

    padding:10px;

    border-radius:10px;

    border:1px solid #ccc;

    box-sizing:border-box;
}

button{

    height:45px;

    padding:0 20px;

    border:none;

    border-radius:10px;

    background:#5f8136;

    color:white;

    cursor:pointer;
}

table{

    width:100%;

    margin-top:25px;

    border-collapse:collapse;
}

th{

    background:#5f8136;

    color:white;

    padding:12px;
}

td{

    padding:10px;

    border-bottom:1px solid #ddd;

    text-align:center;
}

tr:hover{

    background:#f7f7f7;
}

.desligado{
    color:#c0392b;
    font-weight:bold;
}

.manual{
    color:#2980b9;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topo">

    <h1>Histórico de Solicitações</h1>

    <button onclick="voltar()">
        ← Voltar ao Painel
    </button>

</div>

<div class="container">

<div class="card">

    <h2>Pesquisar</h2>

    <input
        id="apartamento"
        placeholder="Apartamento">

    <button onclick="carregar()">
        Buscar
    </button>

    <table>

        <thead>

        <tr>

            <th>Apartamento</th>

            <th>Andar</th>

            <th>Lado</th>

            <th>Ligou</th>

            <th>Desligou</th>

            <th>Duração</th>

            <th>Tipo</th>

        </tr>

        </thead>

        <tbody id="dados">

        </tbody>

    </table>

</div>

</div>

<script>

const API =
"https://exaustores-production.up.railway.app"

const token =
localStorage.getItem("token")

function voltar(){

    location.href="sindico.html"
}

function formatarData(ts){

    if(!ts)
        return "-"

    return new Date(
        ts*1000
    ).toLocaleString("pt-BR")
}

function formatarTempo(seg){

    let h =
    Math.floor(seg/3600)

    let m =
    Math.floor((seg%3600)/60)

    return h+"h "+m+"min"
}

async function carregar(){

    const apto =
    document.getElementById(
        "apartamento"
    ).value

    const res =
    await fetch(

        `${API}/sindico/historico?apartamento=${apto}`,

        {
            headers:{
                Authorization:
                "Bearer "+token
            }
        }

    )

    const lista =
    await res.json()

    let html=""

    lista.forEach(r=>{

        html+=`

        <tr>

            <td>${r.apartamento}</td>

            <td>${r.andar}</td>

            <td>${r.lado}</td>

            <td>${formatarData(r.inicio)}</td>

            <td>${formatarData(r.fim)}</td>

            <td>${formatarTempo(r.tempo_total)}</td>

            <td class="${
                r.desligamento=="Automático"
                ? "desligado"
                : "manual"
            }">

                ${r.desligamento}

            </td>

        </tr>

        `

    })

    if(html==""){

        html=`
        <tr>

        <td colspan="7">

        Nenhum registro encontrado

        </td>

        </tr>
        `
    }

    document.getElementById(
        "dados"
    ).innerHTML=html

}

carregar()

</script>

</body>
</html>
