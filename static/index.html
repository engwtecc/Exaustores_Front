<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanic - Exaustores</title>

  <link rel="stylesheet" href="style.css">

  <script defer src="script.js"></script>
</head>

<body>

<div class="container">

  <div class="left">

    <div class="overlay"></div>

    <img src="img/bg.jpg" class="bg">

    <div class="logo-box">
      <div class="logo-circle">
        <h1>B</h1>
        <h2>BOTANIC</h2>
        <span>CONSCIENTE LIFE</span>
      </div>
    </div>

  </div>

  <div class="right">

    <div class="login-card">

      <h1>Bem-vindo ao Botanic</h1>

      <p>Acesse sua conta para continuar</p>

      <input
        type="text"
        id="usuario"
        placeholder="Usuário"
      >

      <input
        type="password"
        id="senha"
        placeholder="Senha"
      >

      <button onclick="login()">
        Entrar
      </button>

      <div id="erro"></div>

    </div>

  </div>

</div>

</body>
</html>
