<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Morador</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f2f4ef;
}

.topo{
    width:100%;
    height:80px;
    background:#5f8136;
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;
}

.topo h1{
    font-size:28px;
}

.topo button{
    width:140px;
    height:45px;

    border:none;
    border-radius:10px;

    background:white;
    color:#5f8136;

    font-weight:bold;

    cursor:pointer;
}

.container-morador{
    width:100%;
    padding:40px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:25px;

    padding:30px;

    box-shadow:0 5px 20px rgba(0,0,0,0.08);

    text-align:center;
}

.card h2{
    color:#5f8136;
    margin-bottom:20px;
}

.card img{
    width:120px;
    margin-bottom:20px;
}

.status{
    font-size:22px;
    margin-bottom:20px;
    font-weight:bold;
}

.ligado{
    color:green;
}

.desligado{
    color:red;
}

.card button{
    width:100%;
    height:50px;

    border:none;
    border-radius:12px;

    background:#5f8136;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="topo">

    <h1>Controle de Exaustores</h1>

    <button onclick="logout()">
        Sair
    </button>

</div>

<div class="container-morador" id="cards">

</div>

<script>

const API = "https://exaustores-production.up.railway.app"

const token = localStorage.getItem("token")

if(!token){

    window.location.href = "index.html"

}

async function carregar(){

    const res = await fetch(`${API}/status`)

    const data = await res.json()

    const cards = document.getElementById("cards")

    cards.innerHTML = ""

    Object.entries(data.exaustores).forEach(([lado, ligado])=>{

        cards.innerHTML += `

        <div class="card">

            <h2>Lado ${lado}</h2>

            <img src="${
                ligado
                ? 'img/Exaustor_On.png'
                : 'img/Exaustor_Off.png'
            }">

            <div class="status ${
                ligado
                ? 'ligado'
                : 'desligado'
            }">

                ${
                    ligado
                    ? 'LIGADO'
                    : 'DESLIGADO'
                }

            </div>

            <button onclick="toggle(${lado}, ${ligado})">

                ${
                    ligado
                    ? 'Desligar'
                    : 'Ligar'
                }

            </button>

        </div>
        `
    })

}

async function toggle(lado, ligado){

    await fetch(`${API}/acao`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body:JSON.stringify({
            acao: ligado
                ? "desligar"
                : "ligar"
        })
    })

    carregar()

}

function logout(){

    localStorage.clear()

    window.location.href = "index.html"

}

carregar()

setInterval(carregar,5000)

</script>

</body>
</html>
